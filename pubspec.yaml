name: mss_offline_ai
description: MSS AI - a fully branded offline translation, writing and chat application.
publish_to: none
version: 1.1.1+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  llama_flutter_android: ^0.2.6
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  shared_preferences: ^2.5.3
  dio: ^5.8.0+1
  crypto: ^3.0.6
  share_plus: ^10.1.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/mss_ai_logo.png
